name: Mantener despierta la API (Render)

# El plan gratis de Render "duerme" el servicio despues de ~15 minutos
# sin recibir ninguna peticion, y despertarlo puede tardar mas de un
# minuto (inaceptable justo durante la sustentacion). Este workflow le
# hace un ping liviano cada 5 minutos, todo el tiempo, para que nunca
# llegue a dormirse -- sin depender de que alguien se acuerde de abrir
# el sitio antes.
#
# IMPORTANTE (ver memoria "apagar-despliegue-post-sustentacion"):
# despues de la sustentacion hay que BORRAR este archivo (o el repo
# completo de Actions) junto con el resto del despliegue -- si no, va a
# seguir pingueando la API para siempre, sin necesidad.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub, por si
  # se necesita despertarla ya mismo sin esperar al proximo ciclo.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -sf --max-time 90 https://casa-vibratoria.onrender.com/api/status || true
